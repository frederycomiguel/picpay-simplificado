services:
  postgres:
    image: postgres:16-alpine
    container_name: picpay-postgres
    environment:
      POSTGRES_DB: picpay
      POSTGRES_USER: picpay
      POSTGRES_PASSWORD: picpay123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: picpay-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: picpay
      RABBITMQ_DEFAULT_PASS: picpay123
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
